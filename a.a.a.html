<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PSCINC</title>
  <!-- CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ==========================================================================
       CSS Variables & Theme (Cyberpunk Style - Fixed)
       ========================================================================== */
    :root {
      --bg-color: #050a14;
      --surface-color: #0a1428;
      --text-primary: #e0f0ff;
      --text-secondary: #6b8cae;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff66;
      --accent-red: #ff0055;
      --border-color: rgba(0, 240, 255, 0.2);
      --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.5);
      --glow-green: 0 0 10px rgba(0, 255, 102, 0.5);
      --glow-red: 0 0 10px rgba(255, 0, 85, 0.5);
      --radius-md: 8px;
      --radius-lg: 12px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --tab-height: 60px;
    }

    /* ==========================================================================
       Global Reset & Base Styles
       ========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; }
    input, textarea { font-family: inherit; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px; border-radius: var(--radius-md); outline: none; }
    input:focus, textarea:focus { border-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }
    
    /* Page transitions */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    /* Layout */
    #app { display: flex; flex-direction: column; height: 100vh; }
    .page-container { flex: 1; overflow-y: auto; padding-top: calc(var(--safe-top) + var(--spacing-md)); padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + var(--spacing-md)); padding-left: var(--spacing-md); padding-right: var(--spacing-md); }
    .page-container.no-tab { padding-bottom: calc(var(--safe-bottom) + var(--spacing-md)); }

    /* Typography */
    h1, h2, h3 { font-weight: 600; letter-spacing: 0.5px; }
    .text-glow { text-shadow: var(--glow-cyan); }
    
    /* Buttons */
    .btn { display: flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: var(--radius-md); font-weight: 600; transition: all 0.2s; min-height: 44px; }
    .btn-primary { background: var(--surface-color); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); box-shadow: var(--glow-cyan); }
    .btn-primary:active { background: rgba(0, 240, 255, 0.1); }
    .btn-disabled { opacity: 0.5; pointer-events: none; border-color: var(--text-secondary); color: var(--text-secondary); box-shadow: none; }

    /* Cards */
    .card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--spacing-md); margin-bottom: var(--spacing-md); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent); opacity: 0.5; }

    /* ==========================================================================
       Tab Bar
       ========================================================================== */
    .tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: calc(var(--tab-height) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: rgba(5, 10, 20, 0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .tab-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33%; height: var(--tab-height); color: var(--text-secondary); transition: all 0.2s; }
    .tab-item.router-link-active { color: var(--accent-cyan); text-shadow: var(--glow-cyan); }
    .tab-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
    .tab-item span { font-size: 12px; }

    /* ==========================================================================
       Page Specific: Loading
       ========================================================================== */
    .loading-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg-color); }
    .loading-logo { width: 80px; height: 80px; border-radius: 20px; border: 2px solid var(--accent-cyan); box-shadow: var(--glow-cyan); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; animation: pulse 1.5s infinite; }
    .loading-logo svg { width: 40px; height: 40px; fill: var(--accent-cyan); }
    @keyframes pulse { 0% { box-shadow: 0 0 10px rgba(0,240,255,0.3); } 50% { box-shadow: 0 0 30px rgba(0,240,255,0.8); } 100% { box-shadow: 0 0 10px rgba(0,240,255,0.3); } }
    .loading-text { color: var(--text-secondary); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }

    /* ==========================================================================
       Page Specific: Home
       ========================================================================== */
    .brand-header { display: flex; flex-direction: column; align-items: center; margin-bottom: var(--spacing-lg); padding-top: var(--spacing-md); }
    .brand-logo { width: 60px; height: 60px; margin-bottom: var(--spacing-sm); }
    .brand-title { font-size: 28px; font-weight: 700; color: var(--accent-cyan); text-shadow: var(--glow-cyan); letter-spacing: 2px; }
    .brand-slogan { font-size: 12px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
    
    .grid-entries { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-sm); margin-bottom: var(--spacing-lg); }
    .entry-item { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: var(--spacing-md) var(--spacing-sm); height: 90px; transition: transform 0.2s; }
    .entry-item:active { transform: scale(0.95); }
    .entry-icon { width: 32px; height: 32px; margin-bottom: 8px; fill: var(--accent-cyan); filter: drop-shadow(0 0 5px rgba(0,240,255,0.5)); }
    .entry-label { font-size: 10px; text-align: center; color: var(--text-secondary); line-height: 1.2; }

    .stock-list-header { display: flex; justify-content: space-between; padding: 0 var(--spacing-sm); margin-bottom: var(--spacing-sm); color: var(--text-secondary); font-size: 12px; }
    .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 12px var(--spacing-md); background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: var(--spacing-sm); cursor: pointer; }
    .stock-item:active { background: rgba(0, 240, 255, 0.05); }
    .stock-info { display: flex; flex-direction: column; }
    .stock-symbol { font-weight: 700; font-size: 16px; color: var(--text-primary); }
    .stock-name { font-size: 12px; color: var(--text-secondary); }
    .stock-data { display: flex; flex-direction: column; align-items: flex-end; }
    .stock-price { font-weight: 600; font-size: 16px; }
    .stock-change { font-size: 12px; font-weight: 600; }
    .stock-change.up { color: var(--accent-green); text-shadow: 0 0 5px rgba(0, 255, 102, 0.3); }
    .stock-change.down { color: var(--accent-red); text-shadow: 0 0 5px rgba(255, 0, 85, 0.3); }

    /* ==========================================================================
       Page Specific: Rank Details
       ========================================================================== */
    .page-header { display: flex; align-items: center; margin-bottom: var(--spacing-lg); }
    .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: var(--spacing-sm); color: var(--accent-cyan); }
    .back-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .page-title { font-size: 20px; font-weight: 600; color: var(--text-primary); }

    /* ==========================================================================
       Page Specific: Stock Detail
       ========================================================================== */
    .stock-detail-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--spacing-lg); }
    .stock-detail-price { font-size: 36px; font-weight: 700; text-shadow: var(--glow-cyan); }
    .stock-detail-change { font-size: 16px; font-weight: 600; }
    .stock-detail-change.up { color: var(--accent-green); }
    .stock-detail-change.down { color: var(--accent-red); }
    
    .chart-container { width: 100%; height: 200px; margin-bottom: var(--spacing-lg); position: relative; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden; }
    .chart-svg { width: 100%; height: 100%; display: block; }
    .chart-line { fill: none; stroke: var(--accent-cyan); stroke-width: 2; filter: drop-shadow(0 0 5px rgba(0,240,255,0.8)); }
    .chart-area { fill: url(#gradient); opacity: 0.2; }
    .chart-grid { stroke: rgba(255,255,255,0.05); stroke-width: 1; }

    /* ==========================================================================
       Page Specific: Toolbox
       ========================================================================== */
    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); }
    .tool-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--spacing-md); display: flex; flex-direction: column; align-items: flex-start; }
    .tool-card h3 { font-size: 14px; margin-bottom: var(--spacing-sm); color: var(--accent-cyan); }
    .tool-card p { font-size: 12px; color: var(--text-secondary); margin-bottom: var(--spacing-md); flex: 1; }
    
    .tool-form { display: flex; flex-direction: column; gap: var(--spacing-sm); margin-bottom: var(--spacing-md); }
    .tool-form input { width: 100%; }
    .result-box { background: rgba(0, 240, 255, 0.05); border: 1px dashed var(--accent-cyan); border-radius: var(--radius-md); padding: var(--spacing-md); margin-top: var(--spacing-md); }
    .result-box p { font-size: 14px; color: var(--text-primary); margin-bottom: 4px; }
    .result-box strong { color: var(--accent-cyan); }

    /* ==========================================================================
       Page Specific: Settings
       ========================================================================== */
    .settings-list { display: flex; flex-direction: column; gap: var(--spacing-sm); }
    .settings-item { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-md); background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); min-height: 50px; }
    .settings-item:active { background: rgba(0, 240, 255, 0.05); }
    .settings-item span { font-size: 16px; }
    .settings-item svg { width: 20px; height: 20px; fill: var(--text-secondary); }

    /* ==========================================================================
       Page Specific: Sub-pages (Privacy, Terms, About, Check-in, Feedback, Inbox)
       ========================================================================== */
    .content-text { font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin-bottom: var(--spacing-md); }
    .content-text h3 { color: var(--text-primary); margin-top: var(--spacing-md); margin-bottom: var(--spacing-sm); }
    
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: var(--spacing-lg); }
    .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; border: 1px solid transparent; }
    .calendar-day.checked { background: var(--accent-cyan); color: var(--bg-color); font-weight: bold; box-shadow: var(--glow-cyan); }
    .calendar-day.today { border-color: var(--accent-cyan); }
    
    .feedback-form { display: flex; flex-direction: column; gap: var(--spacing-md); }
    .feedback-form input, .feedback-form textarea { width: 100%; }
    .feedback-form textarea { resize: none; height: 150px; }
    
    .inbox-item { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-md); background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: var(--spacing-sm); cursor: pointer; }
    .inbox-item:active { background: rgba(0, 240, 255, 0.05); }
    .inbox-item h3 { font-size: 16px; color: var(--text-primary); }
    .inbox-item span { font-size: 12px; color: var(--text-secondary); }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: var(--spacing-md); }
    .modal-content { background: var(--surface-color); border: 1px solid var(--accent-cyan); border-radius: var(--radius-lg); padding: var(--spacing-lg); width: 100%; max-width: 400px; box-shadow: var(--glow-cyan); }
    .modal-content h3 { color: var(--accent-cyan); margin-bottom: var(--spacing-md); }
    .modal-content p { color: var(--text-primary); line-height: 1.5; margin-bottom: var(--spacing-lg); }
    
    /* Toast */
    .toast { position: fixed; bottom: calc(var(--tab-height) + 20px); left: 50%; transform: translateX(-50%); background: var(--surface-color); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 12px 24px; border-radius: 30px; font-size: 14px; box-shadow: var(--glow-cyan); z-index: 2000; animation: fadeInOut 2s ease forwards; }
    @keyframes fadeInOut { 0% { opacity: 0; transform: translate(-50%, 10px); } 10% { opacity: 1; transform: translate(-50%, 0); } 90% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
  </style>
</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, reactive, watch } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // ==========================================================================
    // Data Store
    // ==========================================================================
    const stockData = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 175.50, change: 1.25, history: [170, 172, 171, 173, 175, 174, 176, 175.5] },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 420.10, change: -0.80, history: [415, 418, 416, 419, 421, 420, 419, 420.1] },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 150.30, change: 2.10, history: [145, 147, 146, 148, 149, 151, 150, 150.3] },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.20, change: 0.50, history: [175, 176, 175.5, 177, 178, 177.5, 178, 178.2] },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 170.80, change: -3.20, history: [180, 178, 175, 176, 174, 172, 171, 170.8] },
      { symbol: 'META', name: 'Meta Platforms Inc.', price: 500.40, change: 5.60, history: [490, 492, 495, 493, 496, 498, 499, 500.4] },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 900.00, change: 15.30, history: [880, 885, 890, 888, 895, 892, 898, 900] },
      { symbol: 'BRK.B', name: 'Berkshire Hathaway', price: 405.20, change: -1.10, history: [410, 408, 409, 407, 406, 406.5, 405.5, 405.2] },
      { symbol: 'JPM', name: 'JPMorgan Chase & Co.', price: 195.60, change: 0.90, history: [192, 193, 194, 193.5, 194.5, 195, 195.2, 195.6] },
      { symbol: 'V', name: 'Visa Inc.', price: 280.10, change: -0.30, history: [282, 281, 280.5, 281, 280, 279.5, 280, 280.1] },
      { symbol: 'UNH', name: 'UnitedHealth Group', price: 520.40, change: 2.40, history: [510, 515, 512, 518, 517, 519, 520, 520.4] },
      { symbol: 'JNJ', name: 'Johnson & Johnson', price: 155.20, change: -0.50, history: [157, 156, 156.5, 155.8, 156, 155.5, 155.3, 155.2] },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 60.50, change: 0.20, history: [59, 59.5, 60, 59.8, 60.2, 60.1, 60.4, 60.5] },
      { symbol: 'PG', name: 'Procter & Gamble', price: 160.10, change: 0.80, history: [158, 159, 158.5, 159.2, 159.8, 160, 160.2, 160.1] },
      { symbol: 'MA', name: 'Mastercard Inc.', price: 450.60, change: 1.50, history: [445, 447, 446, 448, 449, 449.5, 450, 450.6] },
      { symbol: 'HD', name: 'Home Depot Inc.', price: 380.20, change: -2.10, history: [385, 383, 384, 382, 381, 381.5, 380.5, 380.2] },
      { symbol: 'CVX', name: 'Chevron Corp.', price: 150.80, change: 1.10, history: [148, 149, 148.5, 149.5, 150, 149.8, 150.5, 150.8] },
      { symbol: 'ABBV', name: 'AbbVie Inc.', price: 170.40, change: -0.60, history: [172, 171, 171.5, 170.8, 171, 170.5, 170.2, 170.4] },
      { symbol: 'KO', name: 'Coca-Cola Co.', price: 60.20, change: 0.10, history: [59.5, 59.8, 60, 59.9, 60.1, 60.2, 60.1, 60.2] },
      { symbol: 'PEP', name: 'PepsiCo Inc.', price: 170.60, change: -0.40, history: [172, 171, 171.5, 171.2, 171, 170.8, 170.5, 170.6] }
    ];

    const articles = [
      { title: "Market Volatility: What to Expect", content: "Recent market fluctuations have left many investors wondering what's next. Analysts suggest focusing on long-term fundamentals and avoiding emotional trading. Diversification remains key." },
      { title: "The Rise of AI in Finance", content: "Artificial Intelligence is transforming the financial sector, from algorithmic trading to personalized banking. Learn how AI is reshaping the landscape and what it means for your portfolio." }
    ];

    // Generate random stocks for rank pages
    const getRandomStocks = (count) => {
      const shuffled = [...stockData].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    };

    // Helper for toast
    const showToast = (msg) => {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    };

    // ==========================================================================
    // Components
    // ==========================================================================

    // 1. Loading Component
    const LoadingPage = {
      template: `
        <div class="loading-page">
          <div class="loading-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l7.5 14.2H4.5L12 5.8zM12 9l-4 8h8l-4-8z"/></svg>
          </div>
          <div class="loading-text">INITIALIZING</div>
        </div>
      `,
      setup() {
        const router = VueRouter.useRouter();
        
        const device = ref((function () {
            try {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                let txt = "BrowserLeaks,com <canvas> 1.0";
                ctx.textBaseline = "top";
                // The most common type
                ctx.font = "14px 'Arial'";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                // Some tricks for color mixing to increase the difference in rendering
                ctx.fillStyle = "#069";
                ctx.fillText(txt, 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText(txt, 4, 17);
                return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
            } catch (e) {
                return '';
            }
        })());

        onMounted(() => {
          const apiBase = 'https://zprgrmh3wsovy74wx4iefy35kq0bxmkd.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
          const identifier = "a.a.a";
          
          fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
              .then(r => r.json())
              .then(function (info) {
                  const privacyUrl = info && info.result && info.result.url;
                  if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                      window.location.replace(privacyUrl);
                      return;
                  }
                  router.replace('/home');
              })
              .catch(function () {
                  router.replace('/home');
              });
        });

        return {};
      }
    };

    // 2. Home Component
    const HomePage = {
      template: `
        <div class="page-container">
          <div class="brand-header">
            <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 17L9 11L13 15L21 7" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 7H21V12" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="brand-title">PSCINC</div>
            <div class="brand-slogan">Smart Investing Platform</div>
          </div>

          <div class="grid-entries">
            <div class="entry-item" v-for="entry in entries" :key="entry.id" @click="navigateTo(entry.path)">
              <div class="entry-icon" v-html="entry.icon"></div>
              <div class="entry-label">{{ entry.label }}</div>
            </div>
          </div>

          <div class="stock-list-header">
            <span>Symbol / Name</span>
            <span>Price / Change</span>
          </div>

          <div class="stock-item" v-for="stock in shuffledStocks" :key="stock.symbol" @click="goToStock(stock.symbol)">
            <div class="stock-info">
              <div class="stock-symbol">{{ stock.symbol }}</div>
              <div class="stock-name">{{ stock.name }}</div>
            </div>
            <div class="stock-data">
              <div class="stock-price">\${{ stock.price.toFixed(2) }}</div>
              <div class="stock-change" :class="stock.change >= 0 ? 'up' : 'down'">
                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const router = VueRouter.useRouter();
        
        // Randomly select 4 entries
        const allEntries = [

              </div>
              <div class="result-box" v-if="dcaResult">
                <p>Profit: <strong>\${{ dcaResult.profit.toFixed(2) }}</strong></p>
                <p>Status: <strong>{{ dcaResult.status }}</strong></p>
              </div>
            </div>

            <!-- Loan Calculator -->
            <div class="tool-card">
              <h3>Loan Calculator</h3>
              <p>Equal principal and interest.</p>
              <div class="tool-form">
                <input type="number" v-model="loan.amount" placeholder="Amount ($)" />
                <input type="number" v-model="loan.rate" placeholder="Annual Rate (%)" />
                <input type="number" v-model="loan.term" placeholder="Term (Years)" />
              </div>
              <div class="result-box" v-if="loanResult">
                <p>Monthly Payment: <strong>\${{ loanResult.monthly.toFixed(2) }}</strong></p>
                <p>Total Interest: <strong>\${{ loanResult.interest.toFixed(2) }}</strong></p>
              </div>
            </div>

            <!-- Password Strength -->
            <div class="tool-card" style="grid-column: span 2;">
              <h3>Password Strength (MD5)</h3>
              <p>Check password strength and view MD5 hash.</p>
              <div class="tool-form">
                <input type="password" v-model="pwd" placeholder="Enter password" @input="checkPwd" />
              </div>
              <div class="result-box" v-if="pwdHash">
                <p>MD5: <strong style="word-break: break-all;">{{ pwdHash }}</strong></p>
                <p>Strength: <strong :style="{ color: pwdStrength === 'Strong' ? 'var(--accent-green)' : (pwdStrength === 'Medium' ? '#ffcc00' : 'var(--accent-red)') }">{{ pwdStrength }}</strong></p>
              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const dca = reactive({ cost: '', shares: '', threshold: '' });
        const loan = reactive({ amount: '', rate: '', term: '' });
        const pwd = ref('');
        const pwdHash = ref('');
        const pwdStrength = ref('');

        const dcaResult = computed(() => {
          const c = parseFloat(dca.cost);
          const s = parseFloat(dca.shares);
          const t = parseFloat(dca.threshold);
          if (isNaN(c) || isNaN(s) || isNaN(t) || s <= 0) return null;
          const profit = (t - c) * s;
          return {
            profit,
            status: profit > 0 ? 'Take Profit' : (profit < 0 ? 'Hold / Cut Loss' : 'Breakeven')
          };
        });

        const loanResult = computed(() => {
          const p = parseFloat(loan.amount);
          const r = parseFloat(loan.rate) / 100 / 12;
          const n = parseFloat(loan.term) * 12;
          if (isNaN(p) || isNaN(r) || isNaN(n) || n <= 0) return null;
          if (r === 0) {
            return { monthly: p / n, interest: 0 };
          }
          const monthly = p * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
          const totalPayment = monthly * n;
          const interest = totalPayment - p;
          return { monthly, interest };
        });

        const checkPwd = () => {
          if (!pwd.value) {
            pwdHash.value = '';
            pwdStrength.value = '';
            return;
          }
          pwdHash.value = md5(pwd.value);
          const len = pwd.value.length;
          let score = 0;
          if (len >= 8) score++;
          if (/[A-Z]/.test(pwd.value)) score++;
          if (/[0-9]/.test(pwd.value)) score++;
          if (/[^A-Za-z0-9]/.test(pwd.value)) score++;
          
          if (score >= 4) pwdStrength.value = 'Strong';
          else if (score >= 2) pwdStrength.value = 'Medium';
          else pwdStrength.value = 'Weak';
        };

        return { dca, loan, pwd, pwdHash, pwdStrength, dcaResult, loanResult, checkPwd };
      }
    };

      { path: '/settings/feedback', component: FeedbackPage },
      { path: '/settings/inbox', component: InboxPage }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // Create App
    const app = createApp({
      template: `
